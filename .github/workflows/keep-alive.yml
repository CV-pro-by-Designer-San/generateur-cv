# ============================================================================
#  Réveil du projet Supabase
#  ---------------------------------------------------------------------------
#  Sur l'offre gratuite, un projet Supabase est mis en pause après 7 jours
#  sans la moindre requête. L'activation des licences cesserait alors de
#  fonctionner jusqu'à un réveil manuel — une panne silencieuse, au pire
#  moment : le jour où un client active son code après une semaine calme.
#
#  Cette tâche interroge la base deux fois par semaine. La requête est lue
#  par PostgREST puis exécutée par Postgres, ce qui compte comme activité.
#  Elle ne lit rien de sensible : la table est protégée par RLS sans aucune
#  policy, donc la réponse est toujours vide. Seul le fait de l'exécuter compte.
# ============================================================================
name: Réveil Supabase

on:
  schedule:
    # lundi et jeudi à 06h17 UTC — deux passages par semaine, donc jamais
    # plus de 4 jours d'écart, avec de la marge sur le seuil de 7 jours
    - cron: "17 6 * * 1,4"
  workflow_dispatch:        # permet aussi de le lancer à la main

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Interroger la base
        env:
          URL: https://ykcxmplkybizezkxklxd.supabase.co
          ANON: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /tmp/out.txt -w "%{http_code}" --max-time 30 \
            "$URL/rest/v1/cv_licences?select=code_id&limit=1" \
            -H "apikey: $ANON" -H "Authorization: Bearer $ANON")
          echo "Réponse HTTP : $code"
          if [ "$code" != "200" ]; then
            echo "::error::Le projet Supabase n'a pas répondu correctement (HTTP $code)."
            head -c 300 /tmp/out.txt
            exit 1
          fi
          echo "Projet Supabase actif."

      - name: Vérifier le service d'activation des licences
        run: |
          # Code volontairement mal signé : le service doit le refuser.
          # S'il répond autre chose, c'est que la fonction est cassée ou
          # mal configurée — autant le savoir avant les clients.
          out=$(curl -s --max-time 30 -X POST \
            "https://ykcxmplkybizezkxklxd.supabase.co/functions/v1/rapid-worker" \
            -H "Content-Type: application/json" \
            -d '{"p_code":"ABNCV-AAAAAAAA-AAAAAA","p_device":"github-actions-keepalive-0001","p_fp":"keepalive00000001"}')
          echo "Réponse : $out"
          case "$out" in
            *'"invalid"'*) echo "Service d'activation opérationnel." ;;
            *) echo "::error::Réponse inattendue du service d'activation : $out"; exit 1 ;;
          esac
